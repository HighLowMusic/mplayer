<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%; width: 100%;
  font-family: -apple-system, 'Noto Sans JP', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #000; color: #fff;
}

/* 배경 */
.bg {
  position: fixed; inset: 0; z-index: 0;
  background: #0a0a0a;
  overflow: hidden;
}
.bg-blur {
  position: absolute; inset: -80px;
  background-size: cover; background-position: center top;
  filter: blur(80px) brightness(0.3) saturate(1.4);
  transform: scale(1.15);
  opacity: 0; transition: opacity 1s ease;
}
.bg-blur.loaded { opacity: 1; }
.bg-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    rgba(0,0,0,0.3) 0%,
    rgba(0,0,0,0.7) 40%,
    rgba(0,0,0,0.92) 100%);
}

/* 메인 */
.page {
  position: relative; z-index: 1;
  max-width: 600px; margin: 0 auto;
  padding: 0 0 60px;
}

/* 헤더 */
.header {
  padding: max(52px, env(safe-area-inset-top, 52px)) 24px 0;
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 32px;
}
.btn-back {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.1); border: none;
  color: #fff; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; -webkit-tap-highlight-color: transparent;
  transition: background 0.2s;
}
.btn-back:active { background: rgba(255,255,255,0.2); }

/* 아티스트 히어로 */
.artist-hero {
  padding: 0 24px 40px;
  display: flex; flex-direction: column; align-items: center;
  text-align: center; gap: 16px;
}
.artist-avatar {
  width: 120px; height: 120px; border-radius: 50%;
  overflow: hidden; flex-shrink: 0;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  background: rgba(255,255,255,0.08);
}
.artist-avatar img {
  width: 100%; height: 100%; object-fit: cover; object-position: top;
  display: block;
}
.artist-name {
  font-size: 28px; font-weight: 700;
  letter-spacing: -0.5px; line-height: 1.2;
}
.artist-meta {
  font-size: 14px; color: rgba(255,255,255,0.45);
  letter-spacing: 0.3px;
}

/* 섹션 */
.section-title {
  font-size: 20px; font-weight: 700;
  letter-spacing: -0.3px;
  padding: 0 24px; margin-bottom: 16px;
}

/* 앨범 그리드 */
.albums-grid {
  padding: 0 24px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.album-card {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.2s, opacity 0.2s;
}
.album-card:active { transform: scale(0.96); opacity: 0.8; }

.album-thumb {
  width: 100%; aspect-ratio: 1;
  border-radius: 12px; overflow: hidden;
  background: rgba(255,255,255,0.06);
  margin-bottom: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.album-thumb img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.album-title {
  font-size: 14px; font-weight: 600; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 3px;
}
.album-artist {
  font-size: 12px; color: rgba(255,255,255,0.45);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.album-tracks {
  font-size: 11px; color: rgba(255,255,255,0.3);
  margin-top: 2px;
}

/* 로딩 */
.loading {
  display: flex; align-items: center; justify-content: center;
  padding: 80px 0;
}
.loader {
  width: 32px; height: 32px;
  border: 2px solid rgba(255,255,255,0.1);
  border-top-color: rgba(255,255,255,0.7);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error {
  text-align: center; padding: 80px 24px;
  color: rgba(255,255,255,0.4); font-size: 15px;
}

/* 데스크탑 */
@media (min-width: 600px) {
  .page { padding-bottom: 80px; }
  .albums-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .artist-avatar { width: 160px; height: 160px; }
  .artist-name { font-size: 36px; }
}
</style>
</head>
<body>

<div class="bg">
  <div class="bg-blur" id="bgBlur"></div>
  <div class="bg-overlay"></div>
</div>

<div class="page">
  <div class="header">
    <button class="btn-back" onclick="history.back()">‹</button>
  </div>

  <div class="artist-hero">
    <div class="artist-avatar">
      <img id="artistAvatar" src="" alt="">
    </div>
    <div class="artist-name" id="artistName">Loading...</div>
    <div class="artist-meta" id="artistMeta"></div>
  </div>

  <div class="section-title">앨범</div>
  <div id="albumsContainer">
    <div class="loading"><div class="loader"></div></div>
  </div>
</div>

<script>
const params   = new URLSearchParams(location.search);
const artistId = params.get('name') || '';

async function loadArtist() {
  if (!artistId) { showError('아티스트 정보가 없어요'); return; }

  try {
    // artists.json 로드
    const res = await fetch('artists.json');
    if (!res.ok) throw new Error('artists.json 없음');
    const artists = await res.json();

    const artist = artists[artistId];
    if (!artist) throw new Error('아티스트를 찾을 수 없어요');

    document.title = artist.name;
    document.getElementById('artistName').textContent = artist.name;

    // 앨범들 로드
    const albumInfos = await Promise.all(
      artist.albums.map(async (albumId) => {
        try {
          const r = await fetch(`albums/${albumId}/info.json`);
          if (!r.ok) return null;
          const info = await r.json();
          return { id: albumId, ...info };
        } catch(e) { return null; }
      })
    );

    const validAlbums = albumInfos.filter(Boolean);

    // 아티스트 대표 이미지 — 첫 앨범 커버 사용
    if (validAlbums.length > 0) {
      const firstCover = `albums/${validAlbums[0].id}/cover.jpg`;
      document.getElementById('artistAvatar').src = firstCover;
      document.getElementById('bgBlur').style.backgroundImage = `url('${firstCover}')`;
      document.getElementById('bgBlur').classList.add('loaded');
    }

    // 앨범 수 표시
    document.getElementById('artistMeta').textContent =
      `앨범 ${validAlbums.length}장 · 트랙 ${validAlbums.reduce((s, a) => s + a.tracks.length, 0)}곡`;

    renderAlbums(validAlbums);

  } catch(e) { showError(e.message); }
}

function renderAlbums(albums) {
  const container = document.getElementById('albumsContainer');

  if (!albums.length) {
    container.innerHTML = '<div class="error">앨범이 없어요</div>';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'albums-grid';

  albums.forEach(album => {
    const card = document.createElement('div');
    card.className = 'album-card';
    card.onclick = () => {
      location.href = `index.html?album=${album.id}`;
    };

    card.innerHTML = `
      <div class="album-thumb">
        <img src="albums/${album.id}/cover.jpg" alt="${album.title}"
             onerror="this.parentElement.style.background='rgba(255,255,255,0.06)'">
      </div>
      <div class="album-title">${album.title}</div>
      <div class="album-artist">${album.artist}</div>
      <div class="album-tracks">${album.tracks.length}곡</div>
    `;

    grid.appendChild(card);
  });

  container.innerHTML = '';
  container.appendChild(grid);
}

function showError(msg) {
  document.getElementById('albumsContainer').innerHTML =
    `<div class="error">${msg}</div>`;
}

loadArtist();
</script>
</body>
</html>
