<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%; width: 100%;
  font-family: -apple-system, 'Noto Sans JP', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #000; color: #fff;
}

.bg { position: fixed; inset: 0; z-index: 0; background: #0a0a0a; overflow: hidden; }
.bg-blur {
  position: absolute; inset: -80px;
  background-size: cover; background-position: center top;
  filter: blur(80px) brightness(0.3) saturate(1.4);
  transform: scale(1.15);
  opacity: 0; transition: opacity 1s ease;
}
.bg-blur.loaded { opacity: 1; }
.bg-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 40%, rgba(0,0,0,0.92) 100%);
}

.page {
  position: relative; z-index: 1;
  max-width: 600px; margin: 0 auto;
  padding: 0 0 80px;
}

.header {
  padding: max(52px, env(safe-area-inset-top, 52px)) 24px 0;
  margin-bottom: 28px;
}
.btn-back {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.1); border: none;
  color: #fff; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.2s;
}
.btn-back:active { background: rgba(255,255,255,0.2); }

.artist-hero {
  padding: 0 24px 36px;
  display: flex; flex-direction: column; align-items: center;
  text-align: center; gap: 14px;
}
.artist-avatar {
  width: 110px; height: 110px; border-radius: 50%;
  overflow: hidden; background: rgba(255,255,255,0.08);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.artist-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.artist-name { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; }
.artist-meta { font-size: 13px; color: rgba(255,255,255,0.4); }

.section-title {
  font-size: 20px; font-weight: 700;
  padding: 0 24px; margin-bottom: 16px;
}

.albums-grid {
  padding: 0 24px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.album-card {
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform 0.2s, opacity 0.2s;
}
.album-card:active { transform: scale(0.96); opacity: 0.75; }

.album-thumb {
  width: 100%; aspect-ratio: 1;
  border-radius: 12px; overflow: hidden;
  background: rgba(255,255,255,0.06);
  margin-bottom: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.album-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.album-title { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.album-tracks { font-size: 12px; color: rgba(255,255,255,0.35); }

.loading { display: flex; align-items: center; justify-content: center; padding: 80px 0; }
.loader {
  width: 32px; height: 32px;
  border: 2px solid rgba(255,255,255,0.1);
  border-top-color: rgba(255,255,255,0.7);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error { text-align: center; padding: 60px 24px; color: rgba(255,255,255,0.4); font-size: 15px; }

@media (min-width: 600px) {
  .albums-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .artist-avatar { width: 140px; height: 140px; }
  .artist-name { font-size: 32px; }
}
</style>
</head>
<body>

<div class="bg">
  <div class="bg-blur" id="bgBlur"></div>
  <div class="bg-overlay"></div>
</div>

<div class="page">
  <div class="header">
    <button class="btn-back" onclick="history.back()">‹</button>
  </div>

  <div class="artist-hero">
    <div class="artist-avatar"><img id="artistAvatar" src="" alt=""></div>
    <div class="artist-name" id="artistName">Loading...</div>
    <div class="artist-meta" id="artistMeta"></div>
  </div>

  <div class="section-title">앨범</div>
  <div id="albumsContainer">
    <div class="loading"><div class="loader"></div></div>
  </div>
</div>

<script>
const params   = new URLSearchParams(location.search);
const artistId = decodeURIComponent(params.get('name') || '');

async function loadArtist() {
  if (!artistId) { showError('아티스트 정보가 없어요'); return; }

  try {
    // 1. albums.json에서 전체 앨범 목록 로드
    const res = await fetch('albums.json');
    if (!res.ok) throw new Error('albums.json 없음');
    const albumIds = await res.json();

    // 2. 모든 앨범의 info.json 병렬 로드
    const allAlbums = await Promise.all(
      albumIds.map(async (id) => {
        try {
          const r = await fetch(`albums/${id}/info.json`);
          if (!r.ok) return null;
          const info = await r.json();
          return { id, ...info };
        } catch(e) { return null; }
      })
    );

    // 3. 이 아티스트 앨범만 필터링
    // artistId(=HIERAKI) 또는 artist name으로 매칭
    const myAlbums = allAlbums.filter(a =>
      a && (
        a.artistId === artistId ||
        a.artist === artistId ||
        a.artist.includes(artistId) ||
        artistId.includes(a.artistId || '')
      )
    );

    if (!myAlbums.length) throw new Error('앨범을 찾을 수 없어요');

    // 4. 아티스트 정보 표시
    const firstAlbum = myAlbums[0];
    document.title = firstAlbum.artist;
    document.getElementById('artistName').textContent = firstAlbum.artist;
    document.getElementById('artistMeta').textContent =
      `앨범 ${myAlbums.length}장 · 트랙 ${myAlbums.reduce((s, a) => s + a.tracks.length, 0)}곡`;

    // 5. 아바타 — 첫 앨범 커버
    const cover = `albums/${firstAlbum.id}/cover.jpg`;
    document.getElementById('artistAvatar').src = cover;
    document.getElementById('bgBlur').style.backgroundImage = `url('${cover}')`;
    document.getElementById('bgBlur').classList.add('loaded');

    renderAlbums(myAlbums);

  } catch(e) { showError(e.message); }
}

function renderAlbums(albums) {
  const container = document.getElementById('albumsContainer');
  if (!albums.length) { container.innerHTML = '<div class="error">앨범이 없어요</div>'; return; }

  const grid = document.createElement('div');
  grid.className = 'albums-grid';

  albums.forEach(album => {
    const card = document.createElement('div');
    card.className = 'album-card';
    card.onclick = () => { location.href = `index.html?album=${album.id}`; };
    card.innerHTML = `
      <div class="album-thumb">
        <img src="albums/${album.id}/cover.jpg" alt="${album.title}"
             onerror="this.parentElement.style.background='rgba(255,255,255,0.08)'">
      </div>
      <div class="album-title">${album.title}</div>
      <div class="album-tracks">${album.tracks.length}곡</div>
    `;
    grid.appendChild(card);
  });

  container.innerHTML = '';
  container.appendChild(grid);
}

function showError(msg) {
  document.getElementById('albumsContainer').innerHTML = `<div class="error">${msg}</div>`;
  document.getElementById('artistName').textContent = artistId;
}

loadArtist();
</script>
</body>
</html>
