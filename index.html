<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%;
  font-family: -apple-system, 'Noto Sans JP', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #000;
  overflow: hidden;
}

.bg { position: fixed; inset: 0; z-index: 0; }
.bg-art {
  position: absolute; inset: -80px;
  background-size: cover; background-position: center;
  filter: blur(72px) brightness(0.55) saturate(1.6);
  transform: scale(1.15);
}
.bg-gradient {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.10) 30%,
    rgba(0,0,0,0.55) 75%, rgba(0,0,0,0.85) 100%);
}

.player {
  position: relative; z-index: 1;
  width: 100%; height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
}

/* ── 앨범아트 — 애플뮤직 스타일 ── */
.art-wrap {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: center;
  height: 56dvh; align-items: center;
  padding-top: max(48px, env(safe-area-inset-top, 48px));
}
.art-shadow {
  width: min(68vw, 320px);
  aspect-ratio: 1;
  border-radius: 16px;
  box-shadow: 0 32px 72px rgba(0,0,0,0.65), 0 8px 24px rgba(0,0,0,0.4);
  animation: artFloat 6s ease-in-out infinite;
}
@keyframes artFloat {
  0%,100% { transform: translateY(0px) scale(1); }
  50%      { transform: translateY(-10px) scale(1.01); }
}
.art-shadow img {
  width: 100%; height: 100%;
  border-radius: 16px; object-fit: cover; display: block;
}

/* ── 하단 패널 ── */
.info-panel {
  width: 100%; max-width: 440px;
  padding: 0 32px;
  display: flex; flex-direction: column; gap: 20px;
}

.track-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.track-meta { flex: 1; min-width: 0; }
.track-title {
  font-size: 21px; font-weight: 700; color: #fff;
  letter-spacing: -0.3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.25; margin-bottom: 4px;
}
.track-artist {
  font-size: 15px; color: rgba(255,255,255,0.5);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color 0.2s;
}
.track-artist:active { color: rgba(255,255,255,0.85); }
.btn-heart {
  width: 36px; height: 36px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,0.4);
  transition: color 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn-heart:active { transform: scale(0.88); }
.btn-heart svg { width: 24px; height: 24px; }

/* 프로그레스 */
.progress-area { display: flex; flex-direction: column; gap: 6px; }
.progress-track {
  height: 4px; background: rgba(255,255,255,0.2);
  border-radius: 99px; cursor: pointer; position: relative;
}
.progress-track::before { content: ''; position: absolute; inset: -10px 0; }
.progress-fill {
  height: 100%; background: #fff;
  border-radius: 99px; width: 0%;
  transition: width 0.1s linear;
}
.time-row {
  display: flex; justify-content: space-between;
  font-size: 12px; color: rgba(255,255,255,0.4);
  font-variant-numeric: tabular-nums; letter-spacing: 0.2px;
}

/* 컨트롤 */
.controls {
  display: flex; align-items: center;
  justify-content: space-between; padding: 4px 0;
}
.btn {
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #fff; -webkit-tap-highlight-color: transparent;
  transition: opacity 0.15s, transform 0.15s;
}
.btn:active { opacity: 0.5; transform: scale(0.9); }
.btn-sm { width: 44px; height: 44px; color: rgba(255,255,255,0.7); }
.btn-sm svg { width: 26px; height: 26px; }
.btn-play {
  width: 72px; height: 72px; background: #fff;
  border-radius: 50%; color: #000;
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}
.btn-play:active { transform: scale(0.92); opacity: 1; }
.btn-play svg { width: 30px; height: 30px; margin-left: 3px; }
.btn-play.paused svg.play  { display: block; }
.btn-play.paused svg.pause { display: none; }
.btn-play svg.play  { display: none; }
.btn-play svg.pause { display: block; }

/* 반복 버튼 1 뱃지 */
.repeat-badge {
  position: absolute; bottom: 3px; left: 50%;
  transform: translateX(-50%);
  font-size: 8px; font-weight: 800;
  color: #fff; line-height: 1;
  opacity: 0; transition: opacity 0.2s;
  pointer-events: none;
}
.btn-sm.has-badge { position: relative; }
.btn-sm.show-badge .repeat-badge { opacity: 1; }

/* 트랙 dots */
.track-dots {
  display: flex; justify-content: center; gap: 6px;
  min-height: 10px;
}
.track-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.28);
  transition: background 0.3s, transform 0.3s; cursor: pointer;
}
.track-dot.active { background: #fff; transform: scale(1.3); }

/* 가사 한 줄 */
.lyric-bar {
  min-height: 38px; display: flex;
  align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.lyric-current {
  font-size: 14px; font-weight: 400;
  color: rgba(255,255,255,0.6);
  font-family: 'Noto Sans JP', sans-serif;
  letter-spacing: 0.3px; text-align: center;
  transition: opacity 0.25s;
  white-space: normal; word-break: keep-all;
  line-height: 1.5;
}

/* ── 전체 가사 패널 ── */
.lyrics-panel {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
}
.lyrics-panel.open { transform: translateY(0); }

.lyrics-bg {
  position: absolute; inset: 0;
  backdrop-filter: blur(60px) brightness(0.65);
  -webkit-backdrop-filter: blur(60px) brightness(0.65);
  background: rgba(0,0,0,0.1);
}

.lyrics-header {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: space-between;
  padding: max(56px, env(safe-area-inset-top, 56px)) 28px 16px;
}
.lyrics-meta { display: flex; flex-direction: column; gap: 2px; }
.lyrics-album { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.4); letter-spacing: 0.5px; }
.lyrics-track { font-size: 17px; font-weight: 700; color: #fff; }
.btn-close {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.12); border: none;
  color: #fff; font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

.lyrics-scroll {
  position: relative; z-index: 1;
  flex: 1; overflow-y: auto; padding: 16px 28px 140px;
  -webkit-overflow-scrolling: touch;
}
.lyrics-scroll::-webkit-scrollbar { display: none; }

.lyrics-line {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 24px; font-weight: 700;
  line-height: 1.55; color: rgba(255,255,255,0.22);
  padding: 4px 0; cursor: pointer;
  transition: color 0.35s, font-size 0.3s;
}
.lyrics-line.active { color: #fff; font-size: 26px; }
.lyrics-line.passed { color: rgba(255,255,255,0.16); }

/* 미니 플레이어 */
.lyrics-mini {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 2;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 14px 24px max(24px, env(safe-area-inset-bottom, 24px));
  display: flex; align-items: center; gap: 14px;
}
.mini-art {
  width: 46px; height: 46px; border-radius: 8px;
  overflow: hidden; flex-shrink: 0;
}
.mini-art img { width: 100%; height: 100%; object-fit: cover; }
.mini-info { flex: 1; min-width: 0; }
.mini-title { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-artist { font-size: 12px; color: rgba(255,255,255,0.45); }
.mini-btns { display: flex; align-items: center; gap: 4px; }
.mini-btn {
  width: 36px; height: 36px; border: none; background: none;
  color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.mini-btn svg { width: 22px; height: 22px; }
.mini-play-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: #fff; border: none; color: #000;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.mini-play-btn svg { width: 18px; height: 18px; margin-left: 2px; }
.mini-play-btn.paused svg.play  { display: block; }
.mini-play-btn.paused svg.pause { display: none; }
.mini-play-btn svg.play  { display: none; }
.mini-play-btn svg.pause { display: block; }

/* 로딩 */
.loading-overlay {
  position: fixed; inset: 0; z-index: 100; background: #000;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.6s ease;
}
.loading-overlay.done { opacity: 0; pointer-events: none; }
.loader {
  width: 36px; height: 36px;
  border: 2px solid rgba(255,255,255,0.15);
  border-top-color: rgba(255,255,255,0.8);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-msg {
  position: fixed; inset: 0; z-index: 100; background: #111;
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; color: #fff; text-align: center; padding: 24px;
}
.error-msg.show { display: flex; }

/* ── 데스크탑 ── */
@media (min-width: 600px) {
  body { display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }

  /* 배경은 풀스크린으로 */
  .bg { position: fixed; inset: 0; border-radius: 0; }

  /* 플레이어는 중앙에 카드 형태 — 프레임 없음 */
  .player {
    width: 420px;
    height: 100vh;
    border-radius: 0;
    background: transparent;
  }

  .art-wrap {
    padding-top: 64px;
    height: 54dvh;
  }

  .art-shadow {
    width: min(62vw, 340px);
  }

  .lyrics-panel {
    position: fixed; inset: 0;
    border-radius: 0;
  }
  .lyrics-mini { border-radius: 0; }
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay"><div class="loader"></div></div>
<div class="error-msg" id="errorMsg">
  <div style="font-size:48px">⚠️</div>
  <div style="font-size:18px;font-weight:600" id="errorTitle">곡을 불러올 수 없어요</div>
  <div style="font-size:14px;color:rgba(255,255,255,0.5)" id="errorDetail"></div>
</div>

<div class="bg">
  <div class="bg-art" id="bgArt"></div>
  <div class="bg-gradient"></div>
</div>

<div class="player">
  <div class="art-wrap">
    <div class="art-shadow">
      <img id="albumArt" src="" alt="cover">
    </div>
  </div>

  <div class="info-panel">
    <div class="track-row">
      <div class="track-meta">
        <div class="track-title" id="trackTitle">Loading...</div>
        <div class="track-artist" id="trackArtist" onclick="goToArtist()" style="cursor:pointer"></div>
      </div>
      <button class="btn btn-heart" id="btnHeart" onclick="toggleHeart()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
    </div>

    <div class="progress-area">
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-sm has-badge" id="btnRepeat" onclick="toggleRepeat()">
        <svg viewBox="0 0 24 24" fill="currentColor" id="iconRepeat" style="opacity:0.35">
          <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
        </svg>
        <span class="repeat-badge" id="repeatBadge">1</span>
      </button>

      <button class="btn btn-sm" onclick="prevTrack()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>

      <button class="btn btn-play paused" id="btnPlay" onclick="togglePlay()">
        <svg class="play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <svg class="pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>

      <button class="btn btn-sm" onclick="nextTrack()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
      </button>

      <button class="btn btn-sm" onclick="toggleShuffle()" id="btnShuffle">
        <svg viewBox="0 0 24 24" fill="currentColor" id="iconShuffle" style="opacity:0.35">
          <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
        </svg>
      </button>
    </div>

    <div class="track-dots" id="trackDots"></div>

    <div class="lyric-bar" onclick="openLyrics()">
      <div class="lyric-current" id="lyricCurrent">♪</div>
    </div>
  </div>
</div>

<!-- 전체 가사 패널 -->
<div class="lyrics-panel" id="lyricsPanel">
  <div class="lyrics-bg"></div>
  <div class="lyrics-header">
    <div class="lyrics-meta">
      <div class="lyrics-album" id="lyricsAlbum"></div>
      <div class="lyrics-track" id="lyricsTrack"></div>
    </div>
    <button class="btn-close" onclick="closeLyrics()">✕</button>
  </div>
  <div class="lyrics-scroll" id="lyricsScroll"></div>
  <div class="lyrics-mini">
    <div class="mini-art"><img id="miniArt" src="" alt=""></div>
    <div class="mini-info">
      <div class="mini-title" id="miniTitle"></div>
      <div class="mini-artist" id="miniArtist"></div>
    </div>
    <div class="mini-btns">
      <button class="mini-btn" onclick="prevTrack()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="mini-play-btn paused" id="miniPlay" onclick="togglePlay()">
        <svg class="play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <svg class="pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="mini-btn" onclick="nextTrack()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
      </button>
    </div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
const params  = new URLSearchParams(location.search);
const albumId = params.get('album') || '';
const startNo = parseInt(params.get('track') || '1', 10);
const BASE    = albumId ? `albums/${albumId}` : '';

let albumInfo = null, tracks = [], currentIdx = 0;
let isPlaying = false, playPromise = null;
let hearted = false, repeatMode = 0, shuffle = false;
let shuffleOrder = [], lyricsData = [], lastLyricIdx = -1;

const audio = document.getElementById('audio');

function goToArtist() {
  if (!albumInfo) return;
  const id = albumInfo.artistId || albumInfo.artist;
  location.href = `artist.html?name=${encodeURIComponent(id)}`;
}

async function loadAlbum() {
  if (!albumId) { showError('앨범 정보 없음', 'URL에 ?album=앨범명 을 추가해주세요'); return; }
  try {
    const res = await fetch(`${BASE}/info.json`);
    if (!res.ok) throw new Error('info.json 없음');
    albumInfo = await res.json();
    tracks = albumInfo.tracks;

    const cover = `${BASE}/cover.jpg`;
    document.getElementById('albumArt').src = cover;
    document.getElementById('miniArt').src  = cover;
    document.getElementById('bgArt').style.backgroundImage = `url('${cover}')`;
    document.getElementById('trackArtist').textContent = albumInfo.artist;
    document.getElementById('miniArtist').textContent  = albumInfo.artist;
    document.getElementById('lyricsAlbum').textContent = albumInfo.title;

    renderDots();
    currentIdx = Math.max(0, Math.min(startNo - 1, tracks.length - 1));
    loadTrack(currentIdx);

    document.getElementById('albumArt').onload  = () => setTimeout(() => document.getElementById('loadingOverlay').classList.add('done'), 300);
    document.getElementById('albumArt').onerror = () => document.getElementById('loadingOverlay').classList.add('done');

    loadLyrics();
  } catch(e) { showError('앨범을 불러올 수 없어요', e.message); }
}

async function loadLyrics() {
  try {
    const res = await fetch(`${BASE}/lyrics.json`);
    if (!res.ok) return;
    lyricsData = await res.json();
    renderLyricsLines();
  } catch(e) {}
}

function renderLyricsLines() {
  const scroll = document.getElementById('lyricsScroll');
  scroll.innerHTML = '';
  if (!lyricsData.length) {
    scroll.innerHTML = '<div style="color:rgba(255,255,255,0.3);font-size:15px;padding:60px 0;text-align:center;">가사 준비 중</div>';
    return;
  }
  lyricsData.forEach((l, i) => {
    const div = document.createElement('div');
    div.className = 'lyrics-line';
    div.id = `ll${i}`;
    div.textContent = l.text;
    div.onclick = () => { if (l.time !== undefined) audio.currentTime = l.time; };
    scroll.appendChild(div);
  });
}

function loadTrack(idx) {
  const track = tracks[idx];
  if (!track) return;
  currentIdx = idx;
  document.getElementById('trackTitle').textContent  = track.title;
  document.getElementById('miniTitle').textContent   = track.title;
  document.getElementById('lyricsTrack').textContent = track.title;
  document.title = `${track.title} — ${albumInfo.artist}`;
  audio.src = `${BASE}/tracks/${track.file}`;
  audio.load();
  document.querySelectorAll('.track-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  if (isPlaying) playAudio();
}

function renderDots() {
  const c = document.getElementById('trackDots');
  c.innerHTML = '';
  if (tracks.length <= 1) return;
  tracks.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'track-dot' + (i === 0 ? ' active' : '');
    d.onclick = () => { loadTrack(i); if (!isPlaying) togglePlay(); };
    c.appendChild(d);
  });
}

function playAudio() {
  const p = audio.play();
  if (p !== undefined) {
    playPromise = p;
    p.then(() => {
      isPlaying = true;
      document.getElementById('btnPlay').classList.remove('paused');
      document.getElementById('miniPlay').classList.remove('paused');
    }).catch(() => {
      isPlaying = false;
      document.getElementById('btnPlay').classList.add('paused');
      document.getElementById('miniPlay').classList.add('paused');
    });
  }
}

function togglePlay() {
  if (!isPlaying) {
    playAudio();
  } else {
    if (playPromise) { playPromise.then(() => { audio.pause(); playPromise = null; }); }
    else { audio.pause(); }
    isPlaying = false;
    document.getElementById('btnPlay').classList.add('paused');
    document.getElementById('miniPlay').classList.add('paused');
  }
}

function nextTrack() {
  if (shuffle) {
    if (!shuffleOrder.length) buildShuffleOrder();
    loadTrack(shuffleOrder.shift());
  } else {
    loadTrack((currentIdx + 1) % tracks.length);
  }
  if (!isPlaying) togglePlay();
}

function prevTrack() {
  if (audio.currentTime > 3) { audio.currentTime = 0; }
  else { loadTrack((currentIdx - 1 + tracks.length) % tracks.length); if (!isPlaying) togglePlay(); }
}

audio.addEventListener('ended', () => {
  if (repeatMode === 2) { audio.currentTime = 0; playAudio(); }
  else if (repeatMode === 1) { nextTrack(); }
  else {
    const next = (currentIdx + 1) % tracks.length;
    if (next === 0 && tracks.length > 1) {
      isPlaying = false;
      document.getElementById('btnPlay').classList.add('paused');
      document.getElementById('miniPlay').classList.add('paused');
      audio.currentTime = 0;
    } else if (tracks.length > 1) { nextTrack(); }
    else {
      isPlaying = false;
      document.getElementById('btnPlay').classList.add('paused');
      document.getElementById('miniPlay').classList.add('paused');
      audio.currentTime = 0;
    }
  }
});

// 반복: 0=off 1=전체 2=한곡
function toggleRepeat() {
  repeatMode = (repeatMode + 1) % 3;
  const icon  = document.getElementById('iconRepeat');
  const badge = document.getElementById('repeatBadge');
  const btn   = document.getElementById('btnRepeat');
  icon.style.opacity = repeatMode > 0 ? '1' : '0.35';
  badge.style.opacity = repeatMode === 2 ? '1' : '0';
}

function toggleShuffle() {
  shuffle = !shuffle;
  document.getElementById('iconShuffle').style.opacity = shuffle ? '1' : '0.35';
  if (shuffle) buildShuffleOrder();
}

function buildShuffleOrder() {
  shuffleOrder = tracks.map((_, i) => i).filter(i => i !== currentIdx);
  for (let i = shuffleOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
  }
}

function toggleHeart() {
  hearted = !hearted;
  const btn = document.getElementById('btnHeart');
  btn.style.color = hearted ? '#ff4b6e' : '';
  btn.querySelector('svg').setAttribute('fill', hearted ? '#ff4b6e' : 'none');
}

// 프로그레스 드래그
let dragging = false;
document.getElementById('progressTrack').addEventListener('pointerdown', e => { dragging = true; seekTo(e); e.currentTarget.setPointerCapture(e.pointerId); });
document.getElementById('progressTrack').addEventListener('pointermove', e => { if (dragging) seekTo(e); });
document.getElementById('progressTrack').addEventListener('pointerup', () => dragging = false);
function seekTo(e) {
  const r = document.getElementById('progressTrack').getBoundingClientRect();
  if (audio.duration) audio.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * audio.duration;
}

// 가사 패널
function openLyrics()  { document.getElementById('lyricsPanel').classList.add('open'); }
function closeLyrics() { document.getElementById('lyricsPanel').classList.remove('open'); }

let lyricsTouchY = 0;
document.getElementById('lyricsPanel').addEventListener('touchstart', e => { lyricsTouchY = e.touches[0].clientY; });
document.getElementById('lyricsPanel').addEventListener('touchend',   e => { if (e.changedTouches[0].clientY - lyricsTouchY > 80) closeLyrics(); });

// 가사 싱크
function updateLyricsSync(t) {
  if (!lyricsData.length) return;
  let cur = -1;
  for (let i = 0; i < lyricsData.length; i++) { if (lyricsData[i].time !== undefined && t >= lyricsData[i].time) cur = i; }
  if (cur === lastLyricIdx) return;
  lastLyricIdx = cur;
  const el = document.getElementById('lyricCurrent');
  if (cur >= 0) {
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = lyricsData[cur].text; el.style.opacity = '1'; }, 200);
  }
  lyricsData.forEach((_, i) => {
    const line = document.getElementById(`ll${i}`);
    if (!line) return;
    line.className = 'lyrics-line' + (i === cur ? ' active' : i < cur ? ' passed' : '');
  });
  if (cur >= 0) {
    const activeLine = document.getElementById(`ll${cur}`);
    if (activeLine) activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function fmt(s) { if (!s || isNaN(s)) return '0:00'; return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; }

function tick() {
  const t = audio.currentTime, dur = audio.duration || 0;
  document.getElementById('progressFill').style.width = (dur ? t/dur*100 : 0) + '%';
  document.getElementById('currentTime').textContent  = fmt(t);
  document.getElementById('totalTime').textContent    = fmt(dur);
  updateLyricsSync(t);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function showError(title, detail) {
  document.getElementById('loadingOverlay').classList.add('done');
  document.getElementById('errorMsg').classList.add('show');
  document.getElementById('errorTitle').textContent  = title;
  document.getElementById('errorDetail').textContent = detail || '';
}

loadAlbum();
</script>
