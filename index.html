<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%;
  font-family: -apple-system, 'Noto Sans JP', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #000;
  overflow: hidden;
}

.bg { position: fixed; inset: 0; z-index: 0; }
.bg-art {
  position: absolute; inset: -80px;
  background-size: cover; background-position: center;
  filter: blur(72px) brightness(0.55) saturate(1.6);
  transform: scale(1.15);
}
.bg-gradient {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.10) 30%,
    rgba(0,0,0,0.55) 75%, rgba(0,0,0,0.85) 100%);
}

.player {
  position: relative; z-index: 1;
  width: 100%; height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
}

.art-wrap {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: center;
  height: 50dvh; align-items: flex-end;
}
.art-shadow {
  position: relative;
  width: min(58vw, 280px); aspect-ratio: 1;
  margin-bottom: -8px; border-radius: 14px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 8px 24px rgba(0,0,0,0.4);
  animation: artFloat 6s ease-in-out infinite;
}
@keyframes artFloat {
  0%,100% { transform: translateY(0px); }
  50%      { transform: translateY(-8px); }
}
.art-shadow img {
  width: 100%; height: 100%;
  border-radius: 14px; object-fit: cover; display: block;
}

.info-panel {
  width: 100%; max-width: 440px;
  padding: 0 28px;
  display: flex; flex-direction: column; gap: 14px;
}

.track-row { display: flex; align-items: flex-start; justify-content: space-between; }
.track-meta { flex: 1; min-width: 0; }
.track-title {
  font-size: 20px; font-weight: 700; color: #fff;
  letter-spacing: -0.4px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  line-height: 1.2; margin-bottom: 5px;
}
.track-artist {
  font-size: 15px; color: rgba(255,255,255,0.55);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.btn-heart {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px;
  background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,0.4);
  transition: color 0.2s, transform 0.2s;
}
.btn-heart:hover { color: #fff; transform: scale(1.1); }
.btn-heart svg { width: 24px; height: 24px; }

.progress-area { display: flex; flex-direction: column; gap: 8px; }
.progress-track {
  height: 4px; background: rgba(255,255,255,0.2);
  border-radius: 99px; cursor: pointer; position: relative;
}
.progress-track::before { content: ''; position: absolute; inset: -8px 0; }
.progress-fill {
  height: 100%; background: #fff;
  border-radius: 99px; width: 0%;
  transition: width 0.1s linear;
}
.time-row {
  display: flex; justify-content: space-between;
  font-size: 12px; color: rgba(255,255,255,0.45);
  font-variant-numeric: tabular-nums;
}

.controls {
  display: flex; align-items: center;
  justify-content: space-between; padding: 0 4px;
}
.btn {
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #fff; transition: opacity 0.15s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { opacity: 0.6; transform: scale(0.92); }
.btn-sm { width: 40px; height: 40px; color: rgba(255,255,255,0.75); }
.btn-sm svg { width: 26px; height: 26px; }
.btn-play {
  width: 68px; height: 68px; background: #fff;
  border-radius: 50%; color: #000;
  box-shadow: 0 4px 20px rgba(0,0,0,0.35);
  transition: transform 0.2s;
}
.btn-play:active { transform: scale(0.92); }
.btn-play svg { width: 28px; height: 28px; margin-left: 3px; }
.btn-play.paused svg.play  { display: block; }
.btn-play.paused svg.pause { display: none; }
.btn-play svg.play  { display: none; }
.btn-play svg.pause { display: block; }

/* 반복 버튼 — 3단계 */
.btn-repeat-label {
  position: absolute;
  font-size: 8px; font-weight: 700;
  color: #fff; line-height: 1;
  bottom: 4px; left: 50%; transform: translateX(-50%);
  opacity: 0; transition: opacity 0.2s;
  pointer-events: none;
}
.btn-sm.repeat-one .btn-repeat-label { opacity: 1; }

.track-dots {
  display: flex; justify-content: center; gap: 6px; padding: 2px 0;
}
.track-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transition: background 0.3s, transform 0.3s; cursor: pointer;
}
.track-dot.active { background: #fff; transform: scale(1.3); }

/* ── 가사 바 ── */
.lyric-bar {
  height: 40px; display: flex;
  align-items: center; justify-content: center;
  cursor: pointer; position: relative;
  -webkit-tap-highlight-color: transparent;
}
.lyric-current {
  font-size: 14px; font-weight: 400;
  color: rgba(255,255,255,0.7);
  font-family: 'Noto Sans JP', sans-serif;
  letter-spacing: 0.3px; text-align: center;
  transition: opacity 0.25s;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  width: 100%;
}

/* ── 전체 가사 패널 ── */
.lyrics-panel {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
}
.lyrics-panel.open { transform: translateY(0); }

.lyrics-bg {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.06);
  backdrop-filter: blur(60px) brightness(0.7);
  -webkit-backdrop-filter: blur(60px) brightness(0.7);
}

.lyrics-header {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: space-between;
  padding: 56px 28px 20px;
}
.lyrics-album-info { display: flex; flex-direction: column; gap: 3px; }
.lyrics-album-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.5); letter-spacing: 0.3px; }
.lyrics-track-title { font-size: 16px; font-weight: 700; color: #fff; }
.btn-lyrics-close {
  width: 32px; height: 32px;
  background: rgba(255,255,255,0.15);
  border: none; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}

.lyrics-scroll {
  position: relative; z-index: 1;
  flex: 1; overflow-y: auto;
  padding: 20px 28px 120px;
  -webkit-overflow-scrolling: touch;
}
.lyrics-scroll::-webkit-scrollbar { display: none; }

.lyrics-line {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 24px; font-weight: 700;
  line-height: 1.55; letter-spacing: -0.2px;
  color: rgba(255,255,255,0.25);
  padding: 6px 0;
  transition: color 0.4s, font-size 0.3s;
  cursor: pointer;
}
.lyrics-line.active {
  color: #fff;
  font-size: 26px;
}
.lyrics-line.passed { color: rgba(255,255,255,0.18); }

/* 하단 미니 플레이어 (가사 패널 안) */
.lyrics-mini-player {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 2;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 16px 28px;
  padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
  display: flex; align-items: center; gap: 16px;
}
.mini-art {
  width: 48px; height: 48px;
  border-radius: 8px; overflow: hidden; flex-shrink: 0;
}
.mini-art img { width: 100%; height: 100%; object-fit: cover; }
.mini-info { flex: 1; min-width: 0; }
.mini-title {
  font-size: 14px; font-weight: 600; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mini-artist { font-size: 12px; color: rgba(255,255,255,0.5); }
.mini-controls { display: flex; align-items: center; gap: 8px; }
.mini-btn {
  width: 36px; height: 36px; border: none; background: none;
  color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.mini-btn svg { width: 22px; height: 22px; }
.mini-play {
  width: 40px; height: 40px;
  background: #fff; border-radius: 50%; border: none;
  color: #000; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.mini-play svg { width: 18px; height: 18px; margin-left: 2px; }
.mini-play.paused svg.play  { display: block; }
.mini-play.paused svg.pause { display: none; }
.mini-play svg.play  { display: none; }
.mini-play svg.pause { display: block; }



.loading-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.6s ease;
}
.loading-overlay.done { opacity: 0; pointer-events: none; }
.loader {
  width: 36px; height: 36px;
  border: 2px solid rgba(255,255,255,0.15);
  border-top-color: rgba(255,255,255,0.8);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-msg {
  position: fixed; inset: 0; z-index: 100;
  background: #111; display: none;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; color: #fff; text-align: center; padding: 24px;
}
.error-msg.show { display: flex; }

@media (min-width: 600px) {
  body { display: flex; align-items: center; justify-content: center; background: #1a1a1a; }
  .player { width: 390px; height: 844px; border-radius: 24px; overflow: hidden; position: relative; }
  .bg { border-radius: 24px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,0.7); }
  .lyrics-panel { width: 390px; left: 50%; transform: translateX(-50%) translateY(100%); border-radius: 24px; overflow: hidden; }
  .lyrics-panel.open { transform: translateX(-50%) translateY(0); }
  .lyrics-mini-player { border-radius: 0 0 24px 24px; }
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay"><div class="loader"></div></div>
<div class="error-msg" id="errorMsg">
  <div style="font-size:48px">⚠️</div>
  <div style="font-size:18px;font-weight:600" id="errorTitle">곡을 불러올 수 없어요</div>
  <div style="font-size:14px;color:rgba(255,255,255,0.5)" id="errorDetail"></div>
</div>

<div class="bg">
  <div class="bg-art" id="bgArt"></div>
  <div class="bg-gradient"></div>
</div>

<div class="player">
  <div class="art-wrap">
    <div class="art-shadow">
      <img id="albumArt" src="" alt="cover">
    </div>
  </div>

  <div class="info-panel">
    <div class="track-row">
      <div class="track-meta">
        <div class="track-title" id="trackTitle">Loading...</div>
        <div class="track-artist" id="trackArtist"></div>
      </div>
      <button class="btn btn-heart" id="btnHeart" onclick="toggleHeart()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
    </div>

    <div class="progress-area">
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <div class="controls">
      <!-- 반복 버튼: 0=off, 1=전체반복, 2=한곡반복 -->
      <button class="btn btn-sm" id="btnRepeat" onclick="toggleRepeat()" title="반복" style="position:relative">
        <svg viewBox="0 0 24 24" fill="currentColor" id="iconRepeat" style="opacity:0.35">
          <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
        </svg>
        <span class="btn-repeat-label" id="repeatLabel">1</span>
      </button>

      <button class="btn btn-sm" onclick="prevTrack()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>

      <button class="btn btn-play paused" id="btnPlay" onclick="togglePlay()">
        <svg class="play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <svg class="pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>

      <button class="btn btn-sm" onclick="nextTrack()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
      </button>

      <button class="btn btn-sm" onclick="toggleShuffle()" id="btnShuffle">
        <svg viewBox="0 0 24 24" fill="currentColor" id="iconShuffle" style="opacity:0.35">
          <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
        </svg>
      </button>
    </div>

    <div class="track-dots" id="trackDots"></div>

    <div class="lyric-bar" onclick="openLyrics()">
      <div class="lyric-current" id="lyricCurrent">♪</div>
    </div>


  </div>
</div>

<!-- ── 전체 가사 패널 ── -->
<div class="lyrics-panel" id="lyricsPanel">
  <div class="lyrics-bg"></div>

  <div class="lyrics-header">
    <div class="lyrics-album-info">
      <div class="lyrics-album-title" id="lyricsAlbumTitle"></div>
      <div class="lyrics-track-title" id="lyricsTrackTitle"></div>
    </div>
    <button class="btn-lyrics-close" onclick="closeLyrics()">✕</button>
  </div>

  <div class="lyrics-scroll" id="lyricsScroll">
    <!-- 가사 라인들 -->
  </div>

  <div class="lyrics-mini-player">
    <div class="mini-art"><img id="miniArt" src="" alt=""></div>
    <div class="mini-info">
      <div class="mini-title" id="miniTitle"></div>
      <div class="mini-artist" id="miniArtist"></div>
    </div>
    <div class="mini-controls">
      <button class="mini-btn" onclick="prevTrack()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="mini-play paused" id="miniPlay" onclick="togglePlay()">
        <svg class="play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <svg class="pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="mini-btn" onclick="nextTrack()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
      </button>
    </div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
const params  = new URLSearchParams(location.search);
const albumId = params.get('album') || '';
const startNo = parseInt(params.get('track') || '1', 10);
const BASE    = albumId ? `albums/${albumId}` : '';

let albumInfo   = null;
let tracks      = [];
let currentIdx  = 0;
let isPlaying   = false;
let playPromise = null;
let hearted     = false;
let repeatMode  = 0; // 0=off 1=전체 2=한곡
let shuffle     = false;
let vol         = 0.8;
let shuffleOrder = [];

// 가사 데이터 (LRC 연동 전 임시 — info.json에서 나중에 로드)
let lyricsData  = [];

const audio = document.getElementById('audio');
audio.volume = vol;


// ── 앨범 로드 ──
async function loadAlbum() {
  if (!albumId) { showError('앨범 정보 없음', 'URL에 ?album=앨범명 을 추가해주세요'); return; }
  try {
    const res = await fetch(`${BASE}/info.json`);
    if (!res.ok) throw new Error('info.json 없음');
    albumInfo = await res.json();
    tracks    = albumInfo.tracks;

    const coverUrl = `${BASE}/cover.jpg`;
    document.getElementById('albumArt').src = coverUrl;
    document.getElementById('miniArt').src  = coverUrl;
    document.getElementById('bgArt').style.backgroundImage = `url('${coverUrl}')`;
    document.getElementById('trackArtist').textContent = albumInfo.artist;
    document.getElementById('miniArtist').textContent  = albumInfo.artist;
    document.getElementById('lyricsAlbumTitle').textContent = albumInfo.title;

    renderDots();
    currentIdx = Math.max(0, Math.min(startNo - 1, tracks.length - 1));
    loadTrack(currentIdx);

    document.getElementById('albumArt').onload  = () => setTimeout(() => document.getElementById('loadingOverlay').classList.add('done'), 400);
    document.getElementById('albumArt').onerror = () => document.getElementById('loadingOverlay').classList.add('done');

    // 가사 로드 시도 (lyrics.json 있으면)
    loadLyrics();

  } catch(e) { showError('앨범을 불러올 수 없어요', e.message); }
}

// ── 가사 로드 ──
async function loadLyrics() {
  try {
    const res = await fetch(`${BASE}/lyrics.json`);
    if (!res.ok) return;
    lyricsData = await res.json();
    renderLyricsLines();
  } catch(e) { /* 가사 없으면 그냥 넘어감 */ }
}

// ── 가사 라인 렌더 ──
function renderLyricsLines() {
  const scroll = document.getElementById('lyricsScroll');
  scroll.innerHTML = '';
  if (!lyricsData.length) {
    scroll.innerHTML = '<div style="color:rgba(255,255,255,0.3);font-size:15px;padding:40px 0;text-align:center;">가사 준비 중</div>';
    return;
  }
  lyricsData.forEach((l, i) => {
    const div = document.createElement('div');
    div.className = 'lyrics-line';
    div.id = `ll${i}`;
    div.textContent = l.text;
    div.onclick = () => { if (l.time !== undefined) audio.currentTime = l.time; };
    scroll.appendChild(div);
  });
}

// ── 트랙 로드 ──
function loadTrack(idx) {
  const track = tracks[idx];
  if (!track) return;
  currentIdx = idx;

  document.getElementById('trackTitle').textContent  = track.title;
  document.getElementById('miniTitle').textContent   = track.title;
  document.getElementById('lyricsTrackTitle').textContent = track.title;
  document.title = `${track.title} — ${albumInfo.artist}`;
  audio.src = `${BASE}/tracks/${track.file}`;
  audio.load();

  document.querySelectorAll('.track-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  if (isPlaying) playAudio();
}

function renderDots() {
  const c = document.getElementById('trackDots');
  c.innerHTML = '';
  if (tracks.length <= 1) return;
  tracks.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'track-dot' + (i === currentIdx ? ' active' : '');
    d.onclick = () => { loadTrack(i); if (!isPlaying) togglePlay(); };
    c.appendChild(d);
  });
}

// ── 재생 ──
function playAudio() {
  const p = audio.play();
  if (p !== undefined) {
    playPromise = p;
    p.then(() => {
      isPlaying = true;
      document.getElementById('btnPlay').classList.remove('paused');
      document.getElementById('miniPlay').classList.remove('paused');
    }).catch(e => {
      isPlaying = false;
      document.getElementById('btnPlay').classList.add('paused');
      document.getElementById('miniPlay').classList.add('paused');
    });
  }
}

function togglePlay() {
  if (!isPlaying) {
    playAudio();
  } else {
    if (playPromise) { playPromise.then(() => { audio.pause(); playPromise = null; }); }
    else { audio.pause(); }
    isPlaying = false;
    document.getElementById('btnPlay').classList.add('paused');
    document.getElementById('miniPlay').classList.add('paused');
  }
}

// ── 트랙 이동 ──
function nextTrack() {
  if (shuffle) {
    if (!shuffleOrder.length) buildShuffleOrder();
    loadTrack(shuffleOrder.shift());
  } else {
    loadTrack((currentIdx + 1) % tracks.length);
  }
  if (!isPlaying) togglePlay();
}

function prevTrack() {
  if (audio.currentTime > 3) { audio.currentTime = 0; }
  else {
    loadTrack((currentIdx - 1 + tracks.length) % tracks.length);
    if (!isPlaying) togglePlay();
  }
}

// ── 곡 끝 ──
audio.addEventListener('ended', () => {
  if (repeatMode === 2) {
    // 한곡 반복
    audio.currentTime = 0; playAudio();
  } else if (repeatMode === 1) {
    // 전체 반복 (마지막 곡이면 처음으로)
    nextTrack();
  } else {
    // 반복 없음
    if (tracks.length > 1) {
      const next = (currentIdx + 1) % tracks.length;
      if (next === 0) {
        // 마지막 곡 끝 → 정지
        isPlaying = false;
        document.getElementById('btnPlay').classList.add('paused');
        document.getElementById('miniPlay').classList.add('paused');
        audio.currentTime = 0;
      } else {
        nextTrack();
      }
    } else {
      isPlaying = false;
      document.getElementById('btnPlay').classList.add('paused');
      document.getElementById('miniPlay').classList.add('paused');
      audio.currentTime = 0;
    }
  }
});

// ── 반복 토글 (0→1→2→0) ──
function toggleRepeat() {
  repeatMode = (repeatMode + 1) % 3;
  const icon  = document.getElementById('iconRepeat');
  const label = document.getElementById('repeatLabel');
  const btn   = document.getElementById('btnRepeat');
  if (repeatMode === 0) {
    icon.style.opacity = '0.35';
    label.style.opacity = '0';
    btn.classList.remove('repeat-one');
  } else if (repeatMode === 1) {
    // 전체 반복
    icon.style.opacity = '1';
    label.style.opacity = '0';
    btn.classList.remove('repeat-one');
  } else {
    // 한곡 반복 — 숫자 1 표시
    icon.style.opacity = '1';
    label.style.opacity = '1';
    btn.classList.add('repeat-one');
  }
}

function toggleShuffle() {
  shuffle = !shuffle;
  document.getElementById('iconShuffle').style.opacity = shuffle ? '1' : '0.35';
  if (shuffle) buildShuffleOrder();
}

function buildShuffleOrder() {
  shuffleOrder = tracks.map((_, i) => i).filter(i => i !== currentIdx);
  for (let i = shuffleOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
  }
}

function toggleHeart() {
  hearted = !hearted;
  const btn = document.getElementById('btnHeart');
  btn.style.color = hearted ? '#ff4b6e' : '';
  btn.querySelector('svg').setAttribute('fill', hearted ? '#ff4b6e' : 'none');
}



// ── 프로그레스 드래그 ──
let dragging = false;
document.getElementById('progressTrack').addEventListener('pointerdown', e => { dragging = true; seekTo(e); e.currentTarget.setPointerCapture(e.pointerId); });
document.getElementById('progressTrack').addEventListener('pointermove', e => { if (dragging) seekTo(e); });
document.getElementById('progressTrack').addEventListener('pointerup', () => dragging = false);
function seekTo(e) {
  const r = document.getElementById('progressTrack').getBoundingClientRect();
  if (audio.duration) audio.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * audio.duration;
}

// ── 가사 패널 ──
function openLyrics() {
  document.getElementById('lyricsPanel').classList.add('open');
}
function closeLyrics() {
  document.getElementById('lyricsPanel').classList.remove('open');
}
// 스와이프 다운으로 닫기
let lyricsTouchY = 0;
document.getElementById('lyricsPanel').addEventListener('touchstart', e => { lyricsTouchY = e.touches[0].clientY; });
document.getElementById('lyricsPanel').addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - lyricsTouchY > 80) closeLyrics();
});

// ── 가사 싱크 ──
let lastLyricIdx = -1;
function updateLyricsSync(t) {
  if (!lyricsData.length) return;
  let cur = -1;
  for (let i = 0; i < lyricsData.length; i++) {
    if (lyricsData[i].time !== undefined && t >= lyricsData[i].time) cur = i;
  }
  if (cur === lastLyricIdx) return;
  lastLyricIdx = cur;

  // 한 줄 가사 업데이트
  const el = document.getElementById('lyricCurrent');
  if (cur >= 0) {
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = lyricsData[cur].text; el.style.opacity = '1'; }, 200);
  }

  // 전체 가사 강조 + 스크롤
  lyricsData.forEach((_, i) => {
    const line = document.getElementById(`ll${i}`);
    if (!line) return;
    line.className = 'lyrics-line' + (i === cur ? ' active' : i < cur ? ' passed' : '');
  });
  if (cur >= 0) {
    const activeLine = document.getElementById(`ll${cur}`);
    if (activeLine) activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

// ── 메인 루프 ──
function tick() {
  const t   = audio.currentTime;
  const dur = audio.duration || 0;
  const pct = dur ? (t / dur * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('currentTime').textContent  = fmt(t);
  document.getElementById('totalTime').textContent    = fmt(dur);
  updateLyricsSync(t);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function showError(title, detail) {
  document.getElementById('loadingOverlay').classList.add('done');
  document.getElementById('errorMsg').classList.add('show');
  document.getElementById('errorTitle').textContent  = title;
  document.getElementById('errorDetail').textContent = detail || '';
}

loadAlbum();
</script>
